<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Listen & Read</title>
<meta name="description" content="Improve your English with stories">
<meta name="theme-color" content="#03040a">

<!-- PWA -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Listen & Read">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Listen & Read">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='.55' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='180' height='180' rx='40' fill='%2303040a'/%3E%3Crect x='20' y='20' width='140' height='140' rx='32' fill='url(%23g)'/%3E%3Cpath d='M55 90l25-22v44z' fill='%23fff'/%3E%3C/svg%3E">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --a1:#22d3ee; --a2:#8b5cf6; --a3:#ec4899;
  --glow:rgba(34,211,238,.5); --glow2:rgba(139,92,246,.4);
  --bg:#03040a; --bg2:#0a0d1a;
  --panel:rgba(15,20,35,.55); --line:rgba(148,163,184,.1);
  --line2:rgba(148,163,184,.18);
  --text:#f8fafc; --text2:#cbd5e1; --text3:#94a3b8; --muted:#475569;
  --hi-1:rgba(251,191,36,.35); --hi-2:rgba(245,158,11,.18); --hi-line:rgba(251,191,36,.75);
  --sh:0 30px 80px rgba(0,0,0,.5);
  --rl:16px; --rx:26px; --rf:999px; --fs:1.28rem;
  --ez:cubic-bezier(.4,0,.2,1); --ezs:cubic-bezier(.34,1.56,.64,1);
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }
body {
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg); color:var(--text);
  line-height:1.5; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  min-height:100vh; -webkit-tap-highlight-color:transparent;
  padding-bottom:env(safe-area-inset-bottom);
}
::selection { background:var(--a1); color:#000; }
button, input { font:inherit; color:inherit; }
button { cursor:pointer; border:none; background:none; }
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--line2); border-radius:var(--rf); }
::-webkit-scrollbar-thumb:hover { background:var(--a1); }

/* Top progress */
.top-progress { position:fixed; top:0; left:0; right:0; height:3px; z-index:100; background:transparent; }
.top-progress-bar { height:100%; width:0%; background:linear-gradient(90deg, var(--a1), var(--a2), var(--a3), var(--a1)); background-size:200% 100%; box-shadow:0 0 12px var(--glow); transition:width .15s linear; border-radius:0 999px 999px 0; animation:barShine 3s linear infinite; }
@keyframes barShine { to { background-position:200% 0; } }

/* Background */
.bg { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.aurora { position:absolute; inset:-50%; background:conic-gradient(from 0deg at 50% 50%, transparent 0deg, rgba(34,211,238,.12) 60deg, transparent 120deg, rgba(139,92,246,.14) 180deg, transparent 240deg, rgba(236,72,153,.1) 300deg, transparent 360deg); animation:spin 60s linear infinite; filter:blur(60px); }
@keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
.blob { position:absolute; border-radius:50%; filter:blur(100px); opacity:.35; will-change:transform; }
.b1 { width:600px; height:600px; background:#22d3ee; top:-20%; left:-15%; animation:f1 25s infinite ease-in-out; }
.b2 { width:500px; height:500px; background:#8b5cf6; bottom:-20%; right:-15%; animation:f2 30s infinite ease-in-out; }
.b3 { width:450px; height:450px; background:#ec4899; top:40%; left:40%; animation:f3 35s infinite ease-in-out; }
.b4 { width:520px; height:520px; background:#6366f1; bottom:10%; left:-10%; animation:f4 28s infinite ease-in-out; }
@keyframes f1 { 0%,100% { transform:translate(0,0) scale(1); } 33% { transform:translate(240px,100px) scale(1.2); } 66% { transform:translate(100px,-140px) scale(.85); } }
@keyframes f2 { 0%,100% { transform:translate(0,0) scale(1); } 33% { transform:translate(-200px,-120px) scale(1.15); } 66% { transform:translate(-80px,140px) scale(.9); } }
@keyframes f3 { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(-180px,-90px) scale(1.25); } }
@keyframes f4 { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(180px,-70px) scale(1.15); } }
.stars { position:absolute; inset:0; background-image:radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.6), transparent),radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,.4), transparent),radial-gradient(1.5px 1.5px at 80% 20%, rgba(255,255,255,.5), transparent),radial-gradient(1px 1px at 40% 90%, rgba(255,255,255,.3), transparent),radial-gradient(2px 2px at 10% 60%, rgba(255,255,255,.4), transparent),radial-gradient(1px 1px at 90% 50%, rgba(255,255,255,.5), transparent); animation:twinkle 8s ease-in-out infinite; opacity:.5; }
@keyframes twinkle { 0%,100% { opacity:.3; } 50% { opacity:.6; } }
.particle { position:absolute; bottom:-5vh; border-radius:50%; opacity:0; pointer-events:none; animation:floatUp linear infinite; will-change:transform, opacity; }
@keyframes floatUp { 0% { transform:translate(0,0); opacity:0; } 10% { opacity:var(--o,.5); } 90% { opacity:var(--o,.5); } 100% { transform:translate(var(--dx,0), -115vh); opacity:0; } }
.bg::after { content:''; position:absolute; inset:0; opacity:.035; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }

#confetti { position:fixed; inset:0; z-index:90; pointer-events:none; overflow:hidden; }
#confetti i { position:absolute; top:-14px; animation:confFall ease-in forwards; }
@keyframes confFall { to { transform:translate(var(--dx,0), 108vh) rotate(var(--rot,360deg)); opacity:.15; } }

/* Layout */
.app { position:relative; z-index:1; max-width:1300px; margin:0 auto; padding:40px 24px 80px; animation:fadeInUp .8s var(--ez) both; }
@keyframes fadeInUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
.hdr { display:flex; align-items:center; gap:18px; margin-bottom:40px; animation:fadeInUp .8s var(--ez) .1s both; }
.logo { width:64px; height:64px; border-radius:20px; background:linear-gradient(135deg, var(--a1), var(--a2) 60%, var(--a3)); display:grid; place-items:center; flex-shrink:0; box-shadow:0 20px 40px var(--glow),0 0 0 1px rgba(255,255,255,.1) inset,0 2px 0 rgba(255,255,255,.3) inset; position:relative; overflow:hidden; transition:transform .4s var(--ezs); }
.logo:hover { transform:rotate(-6deg) scale(1.06); }
.logo::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg, transparent 0%, rgba(255,255,255,.3) 50%, transparent 100%); animation:shine 4s ease-in-out infinite; }
@keyframes shine { 0%,100% { transform:translateX(-100%); } 50% { transform:translateX(100%); } }
.logo svg { width:32px; height:32px; fill:none; stroke:#fff; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; position:relative; z-index:1; filter:drop-shadow(0 2px 4px rgba(0,0,0,.3)); }
.brand-txt h1 { font-size:1.75rem; font-weight:900; letter-spacing:-.04em; line-height:1; background:linear-gradient(135deg, #fff 0%, #cbd5e1 40%, #94a3b8 60%, #fff 100%); background-size:250% 250%; -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 2px 8px rgba(34,211,238,.2)); animation:gradShift 7s ease-in-out infinite; }
@keyframes gradShift { 0%,100% { background-position:0% 50%; } 50% { background-position:100% 50%; } }
.brand-txt p { font-size:.85rem; color:var(--text3); margin-top:6px; font-weight:500; letter-spacing:.02em; }

.grid { display:grid; gap:26px; grid-template-columns:1fr; }
@media (min-width:1000px) { .grid { grid-template-columns:320px 1fr; align-items:start; } }

.panel { background:var(--panel); border:1px solid var(--line); border-radius:var(--rx); padding:26px; backdrop-filter:blur(30px) saturate(180%); -webkit-backdrop-filter:blur(30px) saturate(180%); box-shadow:var(--sh),0 0 0 1px rgba(255,255,255,.03) inset,0 1px 0 rgba(255,255,255,.05) inset; position:relative; overflow:hidden; transition:border-color .4s var(--ez); }
.panel:hover { border-color:rgba(148,163,184,.2); }
.panel::before { content:''; position:absolute; top:0; left:0; right:0; height:1px; background:linear-gradient(90deg, transparent, rgba(255,255,255,.15), transparent); }
.plabel { font-size:.7rem; font-weight:800; letter-spacing:.2em; text-transform:uppercase; color:var(--text3); margin-bottom:18px; display:flex; align-items:center; gap:10px; }
.plabel::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--a1); box-shadow:0 0 12px var(--a1); animation:pulseDot 2s ease-in-out infinite; }
@keyframes pulseDot { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.5; transform:scale(.8); } }
.plabel .cnt { margin-inline-start:auto; font-size:.65rem; letter-spacing:.05em; background:rgba(34,211,238,.12); color:var(--a1); padding:2px 10px; border-radius:var(--rf); border:1px solid rgba(34,211,238,.25); }

.search { position:relative; margin-bottom:14px; }
.search svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:15px; height:15px; stroke:var(--text3); fill:none; stroke-width:2; stroke-linecap:round; pointer-events:none; }
.search input { width:100%; padding:10px 12px 10px 36px; border-radius:12px; background:rgba(255,255,255,.03); border:1px solid var(--line2); font-size:.85rem; transition:all .25s var(--ez); }
.search input:focus { outline:none; border-color:rgba(34,211,238,.5); box-shadow:0 0 0 3px rgba(34,211,238,.15); background:rgba(255,255,255,.05); }
.search input::placeholder { color:var(--muted); }

.slist { list-style:none; display:flex; flex-direction:column; gap:8px; max-height:70vh; overflow-y:auto; padding-right:4px; margin-right:-4px; scrollbar-width:thin; }
.sitem { width:100%; text-align:left; padding:14px 16px; border-radius:var(--rl); background:rgba(255,255,255,.02); border:1px solid transparent; color:var(--text2); font-size:.92rem; font-weight:500; transition:all .3s var(--ez); min-height:52px; display:flex; align-items:center; gap:12px; position:relative; overflow:hidden; animation:listIn .5s var(--ez) both; }
@keyframes listIn { from { opacity:0; transform:translateX(14px); } to { opacity:1; transform:none; } }
.sitem::before { content:''; position:absolute; left:0; top:50%; transform:translateY(-50%); width:3px; height:0; background:linear-gradient(180deg, var(--a1), var(--a2)); border-radius:0 3px 3px 0; transition:height .3s var(--ez); }
.sitem .num { width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,.04); border:1px solid var(--line2); display:grid; place-items:center; font-size:.7rem; font-weight:800; color:var(--text3); flex-shrink:0; transition:all .3s var(--ez); }
.sitem:hover, .sitem:active { background:rgba(34,211,238,.06); border-color:rgba(34,211,238,.2); color:var(--text); transform:translateX(4px); }
.sitem:hover::before { height:60%; }
.sitem.on { background:linear-gradient(90deg, rgba(34,211,238,.15), rgba(139,92,246,.06)); border-color:rgba(34,211,238,.4); color:#fff; font-weight:600; box-shadow:0 8px 32px rgba(34,211,238,.15),0 0 0 1px rgba(34,211,238,.1) inset; }
.sitem.on::before { height:100%; }
.sitem.on .num { background:linear-gradient(135deg, var(--a1), var(--a2)); color:#fff; border-color:transparent; box-shadow:0 0 16px var(--glow); }
.empty { text-align:center; color:var(--text3); font-size:.85rem; padding:50px 20px; line-height:1.8; }

.titlerow { display:flex; align-items:flex-start; gap:12px; margin-bottom:24px; flex-wrap:wrap; }
.stitle { font-size:1.6rem; font-weight:800; line-height:1.25; letter-spacing:-.025em; flex:1; min-width:200px; background:linear-gradient(135deg, #fff 0%, #cbd5e1 100%); -webkit-background-clip:text; background-clip:text; color:transparent; animation:fadeInUp .6s var(--ez) both; display:flex; align-items:center; gap:12px; }
.eq { display:none; gap:3px; align-items:flex-end; height:18px; flex-shrink:0; }
body.playing .eq { display:inline-flex; }
.eq i { width:4px; border-radius:3px; background:linear-gradient(180deg, var(--a1), var(--a3)); animation:eqB 1s ease-in-out infinite; }
.eq i:nth-child(1) { height:9px; animation-delay:0s; }
.eq i:nth-child(2) { height:16px; animation-delay:.18s; }
.eq i:nth-child(3) { height:12px; animation-delay:.36s; }
.eq i:nth-child(4) { height:8px; animation-delay:.54s; }
@keyframes eqB { 0%,100% { transform:scaleY(.4); } 50% { transform:scaleY(1.15); } }

.fs { display:flex; gap:6px; flex-shrink:0; flex-wrap:wrap; }
.fs button { display:inline-flex; align-items:center; justify-content:center; gap:5px; padding:7px 12px; border-radius:10px; font-size:.75rem; font-weight:800; color:var(--text3); background:rgba(255,255,255,.04); border:1px solid var(--line2); transition:all .25s var(--ez); }
.fs button:hover { color:var(--a1); border-color:rgba(34,211,238,.4); background:rgba(34,211,238,.08); transform:translateY(-2px); }
.fs button:active { transform:scale(.92); }
.wmode { padding:7px 12px !important; gap:6px !important; letter-spacing:.02em; }
.wmode svg { width:13px; height:13px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
.wmode.on { color:#fff !important; background:linear-gradient(135deg, var(--a1), var(--a2)) !important; border-color:transparent !important; box-shadow:0 6px 20px var(--glow); }
.wmode.on:hover { transform:translateY(-2px) !important; }

/* INSTALL BUTTON */
.install-wrap { position:fixed; bottom:16px; right:16px; z-index:200; }
.install-btn {
  display:inline-flex; align-items:center; gap:8px;
  padding:12px 20px; border-radius:var(--rf);
  font-size:.85rem; font-weight:700; color:#fff;
  background:linear-gradient(135deg, var(--a1), var(--a2), var(--a3));
  border:1px solid rgba(255,255,255,.2);
  box-shadow:0 10px 30px var(--glow), 0 0 0 1px rgba(255,255,255,.15) inset;
  transition:all .3s var(--ezs);
  animation:installPulse 2.5s ease-in-out infinite;
  backdrop-filter:blur(10px);
  cursor:pointer;
}
.install-btn:hover { transform:translateY(-3px) scale(1.04); box-shadow:0 14px 40px var(--glow); }
.install-btn svg { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
@keyframes installPulse {
  0%,100% { box-shadow:0 10px 30px var(--glow), 0 0 0 1px rgba(255,255,255,.15) inset; }
  50% { box-shadow:0 10px 40px var(--glow), 0 0 0 1px rgba(255,255,255,.25) inset; }
}
.install-btn.hide { display:none; }
.install-btn.done { animation:none; background:rgba(16,185,129,.2); border-color:rgba(16,185,129,.4); color:#34d399; }

/* Install instructions modal */
.install-modal {
  position:fixed; inset:0; z-index:300;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(8px);
  display:none;
  align-items:center; justify-content:center;
  padding:20px;
}
.install-modal.show { display:flex; }
.install-modal-box {
  background:linear-gradient(180deg, #0a0e1a 0%, #050810 100%);
  border:1px solid rgba(34,211,238,.3);
  border-radius:20px;
  padding:28px;
  max-width:420px; width:100%;
  box-shadow:0 30px 80px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.05) inset;
  animation:modalIn .3s var(--ezs);
}
@keyframes modalIn {
  from { opacity:0; transform:scale(.9) translateY(20px); }
  to { opacity:1; transform:scale(1) translateY(0); }
}
.install-modal-box h3 {
  font-size:1.2rem; font-weight:800;
  background:linear-gradient(135deg, var(--a1), var(--a2));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  margin-bottom:16px;
  display:flex; align-items:center; gap:10px;
}
.install-modal-box ol {
  margin:16px 0; padding-left:20px;
  color:var(--text2); line-height:2;
  font-size:.92rem;
}
.install-modal-box li { margin-bottom:8px; }
.install-modal-box li::marker { color:var(--a1); font-weight:800; }
.install-modal-box .close-modal {
  width:100%; padding:12px;
  background:linear-gradient(135deg, var(--a1), var(--a2));
  color:#fff; font-weight:700;
  border-radius:12px; margin-top:8px;
  font-size:.9rem;
}

.whint { display:flex; align-items:center; gap:8px; font-size:.74rem; color:var(--text3); margin-bottom:14px; font-weight:600; padding:8px 14px; border-radius:var(--rf); background:rgba(34,211,238,.05); border:1px solid rgba(34,211,238,.15); width:fit-content; animation:fadeInUp .6s var(--ez) both; }
.whint svg { width:14px; height:14px; fill:none; stroke:var(--a1); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; animation:hintPulse 2.4s ease-in-out infinite; }
@keyframes hintPulse { 0%,100% { transform:scale(1); opacity:1; } 50% { transform:scale(1.15); opacity:.7; } }

.player { display:flex; align-items:center; gap:20px; flex-wrap:wrap; margin-bottom:24px; }
.pgroup { display:flex; align-items:center; gap:10px; flex-shrink:0; }
.rnd { width:50px; height:50px; border-radius:50%; border:1px solid var(--line2); background:rgba(255,255,255,.03); backdrop-filter:blur(10px); display:grid; place-items:center; flex-shrink:0; color:var(--text2); transition:all .3s var(--ez); position:relative; }
.rnd svg { width:20px; height:20px; fill:currentColor; }
.rnd:hover:not(:disabled) { background:rgba(34,211,238,.1); border-color:rgba(34,211,238,.4); color:var(--a1); transform:translateY(-2px); box-shadow:0 8px 20px rgba(34,211,238,.2); }
.rnd:active:not(:disabled) { transform:scale(.94); }
.rnd:disabled { opacity:.3; }
.play-wrap { position:relative; width:76px; height:76px; flex-shrink:0; display:grid; place-items:center; }
.play-wrap .ring { position:absolute; left:-7px; top:-7px; width:calc(100% + 14px); height:calc(100% + 14px); transform:rotate(-90deg); pointer-events:none; filter:drop-shadow(0 0 8px var(--glow)); }
.ring circle { fill:none; stroke-width:4; }
.ring-bg { stroke:rgba(255,255,255,.08); }
.ring-fg { stroke:url(#ringGrad); stroke-linecap:round; stroke-dasharray:289.03; stroke-dashoffset:289.03; transition:stroke-dashoffset .15s linear; }
.rnd.main { width:76px; height:76px; background:linear-gradient(135deg, var(--a1), var(--a2) 60%, var(--a3)); border:none; color:#fff; box-shadow:0 12px 40px var(--glow),0 0 0 1px rgba(255,255,255,.15) inset,0 2px 0 rgba(255,255,255,.3) inset; position:relative; }
.rnd.main svg { width:32px; height:32px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.3)); transition:transform .2s var(--ezs); }
.rnd.main:hover:not(:disabled) svg { transform:scale(1.15); }
.rnd.main:hover:not(:disabled) { transform:translateY(-3px) scale(1.05); box-shadow:0 20px 50px var(--glow),0 0 0 1px rgba(255,255,255,.2) inset,0 2px 0 rgba(255,255,255,.3) inset; }
.rnd.main.playing { animation:playPulse 2s ease-in-out infinite; }
@keyframes playPulse { 0%,100% { box-shadow:0 12px 40px var(--glow),0 0 0 1px rgba(255,255,255,.15) inset; } 50% { box-shadow:0 16px 50px var(--glow),0 0 0 1px rgba(255,255,255,.25) inset; } }
.rnd.on { background:linear-gradient(135deg, var(--a1), var(--a2)); border-color:transparent; color:#fff; box-shadow:0 6px 20px var(--glow); }

.track { flex:1; min-width:180px; }
.seek-wrap { position:relative; height:40px; display:flex; align-items:center; }
#seek { -webkit-appearance:none; appearance:none; width:100%; height:40px; background:transparent; cursor:pointer; outline:none; touch-action:none; -webkit-touch-callout:none; user-select:none; }
#seek::-webkit-slider-runnable-track { height:6px; border-radius:var(--rf); background:linear-gradient(to right, var(--a1) 0%, var(--a2) var(--p,0%), rgba(255,255,255,.08) var(--p,0%), rgba(255,255,255,.08) 100%); box-shadow:0 0 12px rgba(34,211,238,.15) inset; }
#seek::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:#fff; border:3px solid var(--a1); margin-top:-8px; box-shadow:0 4px 16px rgba(0,0,0,.5),0 0 0 4px rgba(34,211,238,.2); transition:transform .15s var(--ezs); }
body.playing #seek::-webkit-slider-thumb { animation:thumbPulse 1.6s ease-in-out infinite; }
@keyframes thumbPulse { 0%,100% { box-shadow:0 4px 16px rgba(0,0,0,.5),0 0 0 4px rgba(34,211,238,.2); } 50% { box-shadow:0 4px 16px rgba(0,0,0,.5),0 0 0 9px rgba(34,211,238,0); } }
#seek:hover::-webkit-slider-thumb { transform:scale(1.15); }
#seek::-moz-range-track { height:6px; border-radius:var(--rf); background:linear-gradient(to right, var(--a1) 0%, var(--a2) var(--p,0%), rgba(255,255,255,.08) var(--p,0%), rgba(255,255,255,.08) 100%); }
#seek::-moz-range-thumb { width:20px; height:20px; border-radius:50%; background:#fff; border:3px solid var(--a1); }
.times { display:flex; justify-content:space-between; font-size:.72rem; color:var(--text3); font-variant-numeric:tabular-nums; font-weight:700; margin-top:4px; padding:0 4px; letter-spacing:.04em; }

.speeds { display:flex; gap:8px; padding:18px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin-bottom:24px; flex-wrap:wrap; align-items:center; }
.speeds::before { content:'Speed'; font-size:.68rem; font-weight:800; letter-spacing:.15em; text-transform:uppercase; color:var(--text3); margin-right:6px; }
.spd { padding:8px 16px; border-radius:var(--rf); font-size:.78rem; font-weight:700; color:var(--text3); background:rgba(255,255,255,.03); border:1px solid var(--line2); min-height:38px; transition:all .3s var(--ez); position:relative; letter-spacing:.02em; }
.spd:hover { color:var(--text); border-color:rgba(34,211,238,.3); background:rgba(34,211,238,.06); transform:translateY(-2px); }
.spd.on { background:linear-gradient(135deg, var(--a1), var(--a2)); color:#fff; border-color:transparent; box-shadow:0 6px 20px var(--glow); transform:scale(1.05); }

.reader { background:rgba(5,8,15,.6); border:1px solid var(--line2); border-radius:var(--rx); padding:40px 36px; max-height:min(65vh,600px); overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; position:relative; box-shadow:0 0 0 1px rgba(255,255,255,.02) inset; }
#text { font-family:'Lora', Georgia, serif; font-size:var(--fs); line-height:2.1; letter-spacing:.003em; color:var(--text2); }
.s { padding:5px 8px; margin:0 -2px; border-radius:10px; cursor:pointer; transition:background .4s var(--ez),color .4s var(--ez),box-shadow .4s var(--ez); display:inline; -webkit-tap-highlight-color:transparent; position:relative; }
.s.enter { animation:sentIn .45s var(--ez) both; }
@keyframes sentIn { from { opacity:0; filter:blur(5px); } to { opacity:1; filter:blur(0); } }
.s:hover { background:rgba(34,211,238,.05); }
.s.active { background:linear-gradient(135deg, var(--hi-1), var(--hi-2), var(--hi-1)); background-size:300% 300%; color:#fff; box-shadow:inset 0 0 0 1.5px var(--hi-line),0 0 30px rgba(251,191,36,.3); box-decoration-break:clone; -webkit-box-decoration-break:clone; animation:hiGlow 3s ease-in-out infinite,bgSlide 5s ease-in-out infinite; }
@keyframes hiGlow { 0%,100% { box-shadow:inset 0 0 0 1.5px var(--hi-line),0 0 24px rgba(251,191,36,.25); } 50% { box-shadow:inset 0 0 0 1.5px var(--hi-line),0 0 40px rgba(251,191,36,.45); } }
@keyframes bgSlide { 0%,100% { background-position:0% 50%; } 50% { background-position:100% 50%; } }
.w { padding:2px 4px; margin:0 -2px; border-radius:6px; cursor:pointer; display:inline; box-decoration-break:clone; -webkit-box-decoration-break:clone; transition:background .25s var(--ez),color .25s var(--ez),box-shadow .3s var(--ez); -webkit-tap-highlight-color:transparent; }
.w:hover { background:rgba(34,211,238,.13); color:#fff; }
.w:active { transform:scale(.97); }
.w.speaking { background:linear-gradient(135deg, rgba(34,211,238,.4), rgba(139,92,246,.3), rgba(236,72,153,.25)); color:#fff; box-shadow:inset 0 0 0 1.5px rgba(34,211,238,.75),0 0 30px rgba(34,211,238,.5); animation:wordPulse 1s ease-in-out infinite; }
@keyframes wordPulse { 0%,100% { box-shadow:inset 0 0 0 1.5px rgba(34,211,238,.75),0 0 16px rgba(34,211,238,.35); } 50% { box-shadow:inset 0 0 0 1.5px rgba(34,211,238,.95),0 0 34px rgba(139,92,246,.6); } }
.note { color:#fda4af; font-size:.82rem; margin-top:14px; min-height:1.2em; font-weight:600; }
.viz { display:flex; gap:3px; align-items:flex-end; height:34px; margin-top:18px; opacity:.45; }
.viz i { flex:1; height:100%; border-radius:3px; background:linear-gradient(180deg, var(--a1), var(--a2), var(--a3)); transform:scaleY(.1); transform-origin:bottom; }
.viz.on i { animation:vz ease-in-out infinite; }
@keyframes vz { 0%,100% { transform:scaleY(.1); } 50% { transform:scaleY(1); } }

.foot { display:flex; gap:18px; flex-wrap:wrap; justify-content:center; margin-top:30px; font-size:.75rem; color:var(--text3); }
.foot kbd { padding:3px 9px; border-radius:8px; background:rgba(255,255,255,.05); border:1px solid var(--line2); font-family:inherit; font-size:.7rem; font-weight:700; color:var(--text2); box-shadow:0 2px 0 rgba(0,0,0,.4); }

@media (max-width:640px) {
  .app { padding:22px 14px 50px; }
  .panel { padding:18px; border-radius:20px; }
  .hdr { margin-bottom:26px; gap:14px; }
  .logo { width:52px; height:52px; border-radius:16px; }
  .logo svg { width:26px; height:26px; }
  .brand-txt h1 { font-size:1.35rem; }
  .brand-txt p { font-size:.78rem; }
  .titlerow { margin-bottom:18px; }
  .stitle { font-size:1.2rem; }
  .reader { padding:24px 16px; border-radius:20px; }
  #text { font-size:calc(var(--fs) - .2rem); }
  .speeds { gap:6px; padding:14px 0; }
  .speeds::before { width:100%; margin-bottom:4px; }
  .spd { flex:1; font-size:.72rem; padding:8px 6px; min-width:0; }
  .blob { filter:blur(70px); opacity:.3; }
  .player { gap:12px; }
  .pgroup { gap:6px; }
  .rnd { width:44px; height:44px; }
  .play-wrap { width:64px; height:64px; }
  .rnd.main { width:64px; height:64px; }
  .rnd.main svg { width:26px; height:26px; }
  .s { padding:7px 9px; margin:-4px -5px; }
  .w { padding:4px 6px; margin:0 -4px; }
  .foot { gap:10px; font-size:.68rem; }
  .install-btn { padding:11px 16px; font-size:.78rem; }
  .install-wrap { bottom:14px; right:14px; }
}
@media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
</style>
</head>
<body>

<div class="top-progress"><div class="top-progress-bar" id="topProgress"></div></div>

<div class="bg" id="bg">
  <div class="aurora"></div>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>
  <div class="stars"></div>
</div>

<div id="confetti"></div>

<div class="app">
  <header class="hdr">
    <div class="logo">
      <svg viewBox="0 0 24 24">
        <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>
        <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
      </svg>
    </div>
    <div class="brand-txt">
      <h1>Listen &amp; Read</h1>
      <p>Improve your English with stories</p>
    </div>
  </header>

  <div class="grid">
    <aside class="panel">
      <div class="plabel">Library <span class="cnt" id="cnt">0</span></div>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="q" placeholder="Search stories…" autocomplete="off">
      </div>
      <ul class="slist" id="list"></ul>
    </aside>

    <main class="panel">
      <audio id="audio" preload="auto" playsinline webkit-playsinline></audio>

      <div class="titlerow">
        <h2 class="stitle">
          <span id="title">Choose a story</span>
          <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        </h2>
        <div class="fs">
          <button id="modeBtn" class="wmode on" title="Word mode (W)">
            <svg viewBox="0 0 24 24">
              <path d="M11 5L6 9H2v6h4l5 4V5z"/>
              <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
            </svg>
            <span id="modeTxt">Word</span>
          </button>
          <button id="fsDn" title="Smaller text">A−</button>
          <button id="fsUp" title="Bigger text">A+</button>
        </div>
      </div>

      <div class="player">
        <div class="pgroup">
          <button id="prev" class="rnd" disabled aria-label="Previous">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg>
          </button>
          <div class="play-wrap">
            <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
              <defs>
                <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%"  stop-color="#22d3ee"/>
                  <stop offset="55%" stop-color="#8b5cf6"/>
                  <stop offset="100%" stop-color="#ec4899"/>
                </linearGradient>
              </defs>
              <circle class="ring-bg" cx="50" cy="50" r="46"/>
              <circle class="ring-fg" id="ringFg" cx="50" cy="50" r="46"/>
            </svg>
            <button id="play" class="rnd main" disabled aria-label="Play">
              <svg id="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
          </div>
          <button id="next" class="rnd" disabled aria-label="Next">
            <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18V6l8.5 6z"/></svg>
          </button>
          <button id="loopBtn" class="rnd" disabled aria-label="Loop">
            <svg viewBox="0 0 24 24">
              <path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/>
              <path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>
            </svg>
          </button>
        </div>
        <div class="track">
          <div class="seek-wrap">
            <input id="seek" type="range" min="0" max="1000" value="0" disabled>
          </div>
          <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
        </div>
      </div>

      <div class="speeds" id="speeds">
        <button class="spd" data-v="0.5">0.5×</button>
        <button class="spd" data-v="0.75">0.75×</button>
        <button class="spd on" data-v="1">1×</button>
        <button class="spd" data-v="1.25">1.25×</button>
        <button class="spd" data-v="1.5">1.5×</button>
      </div>

      <div class="whint" id="whint">
        <svg viewBox="0 0 24 24">
          <path d="M11 5L6 9H2v6h4l5 4V5z"/>
          <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
        </svg>
        <span id="whintText">Click any word to hear it pronounced</span>
      </div>

      <div class="reader" id="reader"><div id="text"></div></div>
      <p class="note" id="note"></p>
      <div class="viz" id="viz" aria-hidden="true"></div>
    </main>
  </div>

  <footer class="foot">
    <span><kbd>Space</kbd> play / pause</span>
    <span><kbd>↑</kbd> previous</span>
    <span><kbd>↓</kbd> next</span>
    <span><kbd>L</kbd> loop</span>
    <span><kbd>W</kbd> word mode</span>
  </footer>
</div>

<!-- Install button -->
<div class="install-wrap">
  <button class="install-btn" id="installBtn">
    <svg viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <path d="M7 10l5 5 5-5"/>
      <path d="M12 15V3"/>
    </svg>
    <span id="installTxt">Install App</span>
  </button>
</div>

<!-- Install instructions modal -->
<div class="install-modal" id="installModal">
  <div class="install-modal-box">
    <h3>
      <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:none;stroke:#22d3ee;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <path d="M7 10l5 5 5-5"/>
        <path d="M12 15V3"/>
      </svg>
      Install Listen & Read
    </h3>
    <p id="installMsg" style="color:var(--text2);font-size:.92rem;line-height:1.8;"></p>
    <ol id="installSteps"></ol>
    <button class="close-modal" id="closeModal">Got it</button>
  </div>
</div>

<script src="stories.js"></script>

<script>
/* ═══════════════════════════════════════════════════
   HELPER — في الأول دايمًا (لازم)
   ═══════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);

/* ═══════════════════════════════════════════════════
   PWA INSTALL
   ═══════════════════════════════════════════════════ */
const installBtn = $('installBtn');
const installTxt = $('installTxt');
const installModal = $('installModal');
const installMsg = $('installMsg');
const installSteps = $('installSteps');
const closeModalBtn = $('closeModal');

let deferredPrompt = null;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
const isAndroid = /Android/i.test(navigator.userAgent);
const isStandalone = window.matchMedia('(display-mode: standalone)').matches
                  || window.navigator.standalone === true;

/* إظهار الزر دايمًا إلا لو مثبت */
if (isStandalone) {
  installBtn.style.display = 'none';
} else {
  installBtn.style.display = 'inline-flex';
  installTxt.textContent = 'Install App';
}

/* Chrome/Edge/Android: beforeinstallprompt */
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'inline-flex';
  installTxt.textContent = 'Install App';
  installBtn.classList.remove('done');
});

/* بعد التثبيت */
window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  installBtn.classList.add('done');
  installTxt.textContent = '✓ Installed';
  setTimeout(() => {
    installBtn.style.display = 'none';
  }, 2500);
});

/* فتح modal التعليمات */
function showInstallModal() {
  if (isIOS) {
    installMsg.textContent = 'تثبيت التطبيق على iPhone:';
    installSteps.innerHTML = `
      <li>افتح الموقع في متصفح <b>Safari</b></li>
      <li>اضغط زر <b>المشاركة</b> (⬆️) تحت في المنتصف</li>
      <li>اسحب لأسفل واختر <b>"Add to Home Screen"</b></li>
      <li>اضغط <b>"Add"</b> فوق على اليمين</li>
    `;
  } else if (isAndroid) {
    installMsg.textContent = 'تثبيت التطبيق على Android:';
    installSteps.innerHTML = `
      <li>اضغط <b>⋮</b> (ثلاث نقاط) فوق على اليمين</li>
      <li>اختر <b>"Install app"</b> أو <b>"Add to Home screen"</b></li>
      <li>اضغط <b>"Install"</b></li>
    `;
  } else {
    installMsg.textContent = 'تثبيت التطبيق على الكمبيوتر:';
    installSteps.innerHTML = `
      <li>في <b>شريط العنوان</b>، شوف أيقونة <b>⬇️</b> على اليمين</li>
      <li>اضغط عليها → <b>"Install"</b></li>
      <li>أو: <b>⋮</b> → <b>"Install Listen &amp; Read"</b></li>
    `;
  }
  installModal.classList.add('show');
}

/* إغلاق modal */
closeModalBtn.addEventListener('click', () => {
  installModal.classList.remove('show');
});
installModal.addEventListener('click', e => {
  if (e.target === installModal) installModal.classList.remove('show');
});

/* الزر */
installBtn.addEventListener('click', async () => {
  /* 1. لو Chrome عطنا prompt — نستخدمه */
  if (deferredPrompt) {
    try {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.classList.add('done');
        installTxt.textContent = '✓ Installing…';
        setTimeout(() => {
          installBtn.style.display = 'none';
        }, 2500);
      }
      deferredPrompt = null;
      return;
    } catch (err) {
      console.warn('Install prompt failed:', err);
    }
  }

  /* 2. تعليمات يدوية */
  showInstallModal();
});

/* ═══════════════════════════════════════════════════
   APP
   ═══════════════════════════════════════════════════ */
const audio = $('audio');
const playBtn = $('play');
const PLAY  = '<path d="M8 5v14l11-7z"/>';
const PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

let story = null, spans = [], active = -1;
let isLooping = false, isSeeking = false, pendingSeek = null;
const RING_C = 289.03;
const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

let wordMode = (localStorage.getItem('lr_word') !== '0');
let speakingEl = null;

const fmt = s => isFinite(s) && s >= 0
  ? `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`
  : '0:00';

/* Speech synthesis */
if ('speechSynthesis' in window) {
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
}

function stopSpeech() {
  if ('speechSynthesis' in window) {
    try { speechSynthesis.cancel(); } catch {}
  }
  if (speakingEl) {
    speakingEl.classList.remove('speaking');
    speakingEl = null;
  }
}

function speakWord(word, el) {
  if (!word) return;
  if (!('speechSynthesis' in window)) {
    $('note').textContent = '⚠️ Browser doesn\'t support speech synthesis';
    return;
  }
  if (speakingEl === el) { stopSpeech(); return; }
  stopSpeech();
  if (!audio.paused) audio.pause();

  speakingEl = el;
  el.classList.add('speaking');

  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US';
  u.rate = Math.max(0.5, Math.min(1.5, audio.playbackRate || 1));
  u.pitch = 1;
  u.volume = 1;

  const voices = speechSynthesis.getVoices();
  const v = voices.find(x => /^en[-_]US/i.test(x.lang) && x.localService)
         || voices.find(x => /^en[-_]GB/i.test(x.lang) && x.localService)
         || voices.find(x => /^en/i.test(x.lang));
  if (v) u.voice = v;

  const clear = () => {
    if (speakingEl === el) {
      el.classList.remove('speaking');
      speakingEl = null;
    }
  };
  u.onend = clear;
  u.onerror = clear;
  speechSynthesis.speak(u);
}

function applyWordMode() {
  $('modeBtn').classList.toggle('on', wordMode);
  $('modeTxt').textContent = wordMode ? 'Word' : 'Sentence';
  $('whintText').textContent = wordMode
    ? 'Click any word to hear it pronounced'
    : 'Click any sentence to play it';
}

$('modeBtn').onclick = () => {
  wordMode = !wordMode;
  try { localStorage.setItem('lr_word', wordMode ? '1' : '0'); } catch {}
  if (!wordMode) stopSpeech();
  applyWordMode();
};

/* Particles */
(function particles() {
  if (reducedMotion()) return;
  const bg = $('bg');
  const cols = ['#22d3ee', '#8b5cf6', '#ec4899', '#fbbf24'];
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('span');
    p.className = 'particle';
    const s = 3 + Math.random() * 7;
    p.style.width = p.style.height = s + 'px';
    p.style.left = (Math.random() * 100) + '%';
    p.style.setProperty('--dx', (Math.random() * 140 - 70) + 'px');
    p.style.setProperty('--o', (.2 + Math.random() * .45).toFixed(2));
    p.style.animationDuration = (9 + Math.random() * 14) + 's';
    p.style.animationDelay = (-Math.random() * 20) + 's';
    const c = cols[i % cols.length];
    p.style.background = `radial-gradient(circle, rgba(255,255,255,.95) 0%, ${c} 45%, transparent 72%)`;
    p.style.boxShadow = `0 0 ${s * 3}px ${c}`;
    bg.appendChild(p);
  }
})();

/* Visualizer bars */
(function buildViz() {
  const viz = $('viz');
  for (let i = 0; i < 44; i++) {
    const b = document.createElement('i');
    b.style.animationDelay = (Math.random() * 1.2).toFixed(2) + 's';
    b.style.animationDuration = (.5 + Math.random() * .8).toFixed(2) + 's';
    viz.appendChild(b);
  }
})();

/* Confetti */
function celebrate() {
  if (reducedMotion()) return;
  const c = $('confetti');
  c.innerHTML = '';
  const cols = ['#22d3ee', '#8b5cf6', '#ec4899', '#fbbf24', '#34d399'];
  for (let i = 0; i < 60; i++) {
    const p = document.createElement('i');
    p.style.left = (Math.random() * 100) + '%';
    p.style.background = cols[i % cols.length];
    p.style.animationDuration = (2.2 + Math.random() * 1.8) + 's';
    p.style.animationDelay = (Math.random() * .5) + 's';
    p.style.setProperty('--dx', (Math.random() * 180 - 90) + 'px');
    p.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    const sz = 6 + Math.random() * 7;
    p.style.width = p.style.height = sz + 'px';
    if (Math.random() < .4) p.style.borderRadius = '50%';
    c.appendChild(p);
  }
  setTimeout(() => c.innerHTML = '', 4800);
}

function setPlaying(on) {
  document.body.classList.toggle('playing', on);
  $('viz').classList.toggle('on', on);
}

/* List */
function renderList(filter = '') {
  const list = $('list');
  if (typeof STORIES === 'undefined' || !STORIES.length) {
    $('cnt').textContent = 0;
    list.innerHTML = '<li class="empty">No stories yet.<br>Edit <b>stories.js</b>.</li>';
    return;
  }
  const f = filter.trim().toLowerCase();
  const shown = STORIES.filter(s => !f || s.title.toLowerCase().includes(f));
  $('cnt').textContent = STORIES.length;
  list.innerHTML = '';
  shown.forEach((s, idx) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.className = 'sitem' + (story && story.id === s.id ? ' on' : '');
    b.dataset.id = s.id;
    b.style.animationDelay = Math.min(idx * 0.05, 0.6) + 's';
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = String(idx + 1).padStart(2, '0');
    const txt = document.createElement('span');
    txt.textContent = s.title;
    b.appendChild(num);
    b.appendChild(txt);
    b.onclick = () => openStory(s.id);
    li.appendChild(b);
    list.appendChild(li);
  });
}

$('q').addEventListener('input', e => renderList(e.target.value));

/* Open story */
function openStory(id) {
  const s = STORIES.find(x => x.id === id);
  if (!s) return;
  stopSpeech();
  story = s;
  active = -1;
  isLooping = false;
  $('loopBtn').classList.remove('on');
  ['play','prev','next','seek','loopBtn'].forEach(k => $(k).disabled = false);
  document.querySelectorAll('.sitem').forEach(b => b.classList.toggle('on', b.dataset.id === id));
  $('title').textContent = s.title;
  $('note').textContent = '';
  $('cur').textContent = '0:00';
  $('dur').textContent = '0:00';
  $('seek').value = 0;
  $('seek').style.setProperty('--p', '0%');
  $('topProgress').style.width = '0%';
  $('ringFg').style.strokeDashoffset = RING_C;
  setPlaying(false);
  try { localStorage.setItem('lr_last', id); } catch {}

  const box = $('text');
  box.innerHTML = '';
  spans = s.sentences.map(([t, txt], i) => {
    const se = document.createElement('span');
    se.className = 's enter';
    se.dataset.i = i;
    se.style.animationDelay = Math.min(i * 0.035, 1.4).toFixed(2) + 's';
    const done = () => { se.classList.remove('enter'); se.style.animationDelay = ''; };
    se.addEventListener('animationend', done, { once: true });
    se.addEventListener('animationcancel', done, { once: true });
    const tokens = String(txt).split(/(\s+)/);
    tokens.forEach(tk => {
      if (!tk) return;
      if (/^\s+$/.test(tk)) {
        se.appendChild(document.createTextNode(tk));
      } else {
        const w = document.createElement('span');
        w.className = 'w';
        w.textContent = tk;
        se.appendChild(w);
      }
    });
    box.appendChild(se);
    box.appendChild(document.createTextNode(' '));
    return se;
  });

  $('reader').scrollTop = 0;
  audio.pause();
  audio.src = s.audio;
  audio.load();
}

function current(t) {
  if (!story) return -1;
  const arr = story.sentences;
  let lo = 0, hi = arr.length - 1, r = -1;
  while (lo <= hi) {
    const m = (lo + hi) >> 1;
    if (arr[m][0] <= t) { r = m; lo = m + 1; }
    else hi = m - 1;
  }
  return r;
}

function paint() {
  const t = audio.currentTime || 0;
  const d = audio.duration || 0;
  const p = d ? t / d : 0;
  $('cur').textContent = fmt(t);
  if (d) $('dur').textContent = fmt(d);
  if (!isSeeking && d) {
    $('seek').value = p * 1000;
    $('seek').style.setProperty('--p', (p * 100).toFixed(1) + '%');
  }
  $('topProgress').style.width = (p * 100).toFixed(1) + '%';
  $('ringFg').style.strokeDashoffset = (RING_C * (1 - p)).toFixed(1);
  if (!story) return;
  if (isLooping && active >= 0) {
    const nextStart = story.sentences[active + 1]?.[0];
    if (nextStart !== undefined && t >= nextStart) {
      audio.currentTime = story.sentences[active][0];
      return;
    }
  }
  const i = current(t);
  if (i !== active) {
    spans.forEach(sp => sp.classList.remove('active'));
    active = i;
    if (i >= 0 && spans[i]) {
      spans[i].classList.add('active');
      const v = $('reader');
      const vr = v.getBoundingClientRect();
      const r = spans[i].getBoundingClientRect();
      if (r.top < vr.top || r.bottom > vr.bottom) {
        v.scrollTo({ top: v.scrollTop + r.top - vr.top - v.clientHeight/2 + r.height/2, behavior: 'smooth' });
      }
    }
  }
}

async function toggle() {
  if (!story) return;
  stopSpeech();
  if (audio.paused) {
    try { await audio.play(); }
    catch (e) { $('note').textContent = '⚠️ ' + e.message; console.error(e); }
  } else { audio.pause(); }
}

function ensureSeekable() {
  return new Promise((resolve, reject) => {
    if (!story) { reject(new Error('No story')); return; }
    if (audio.readyState >= 1) { resolve(); return; }
    const onMeta = () => { cleanup(); resolve(); };
    const onErr  = () => { cleanup(); reject(new Error('Audio failed to load')); };
    const cleanup = () => {
      audio.removeEventListener('loadedmetadata', onMeta);
      audio.removeEventListener('error', onErr);
    };
    audio.addEventListener('loadedmetadata', onMeta);
    audio.addEventListener('error', onErr);
    setTimeout(() => {
      if (audio.readyState === 0) { cleanup(); reject(new Error('Timeout')); }
    }, 3000);
  });
}

async function playFrom(i) {
  if (!story) return;
  const time = story.sentences[i][0];
  spans.forEach(sp => sp.classList.remove('active'));
  active = -1;
  stopSpeech();
  try {
    await ensureSeekable();
    audio.currentTime = time;
    if (audio.paused) await audio.play();
    paint();
  } catch (e) {
    $('note').textContent = '⚠️ ' + (e && e.message ? e.message : 'Cannot play');
    console.error(e);
  }
}

function step(dir) {
  if (!story) return;
  const n = story.sentences.length;
  const cur = active >= 0 ? active : 0;
  const i = Math.min(Math.max(cur + dir, 0), n - 1);
  playFrom(i);
}

document.addEventListener('click', e => {
  const w = e.target.closest('.w');
  if (w && wordMode) { e.stopPropagation(); speakWord(w.textContent.trim(), w); return; }
  const s = e.target.closest('.s');
  if (s) playFrom(parseInt(s.dataset.i, 10));
});

$('play').onclick = toggle;
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('loopBtn').onclick = () => {
  isLooping = !isLooping;
  $('loopBtn').classList.toggle('on', isLooping);
};

/* Seek */
const seekEl = $('seek');
function ratioFromX(clientX) {
  const r = seekEl.getBoundingClientRect();
  return Math.min(1, Math.max(0, (clientX - r.left) / r.width));
}
function applySeekView(ratio) {
  const pct = ratio * 100;
  seekEl.value = Math.round(ratio * 1000);
  seekEl.style.setProperty('--p', pct.toFixed(1) + '%');
  $('topProgress').style.width = pct.toFixed(1) + '%';
  $('ringFg').style.strokeDashoffset = (RING_C * (1 - ratio)).toFixed(1);
  if (audio.duration) {
    pendingSeek = ratio * audio.duration;
    $('cur').textContent = fmt(pendingSeek);
  }
}
function onSeekStart(e) {
  isSeeking = true;
  if (e.pointerId !== undefined) seekEl.setPointerCapture?.(e.pointerId);
  applySeekView(ratioFromX(e.clientX));
}
function onSeekMove(e) { if (!isSeeking) return; applySeekView(ratioFromX(e.clientX)); }
function onSeekEnd() {
  isSeeking = false;
  if (pendingSeek !== null && audio.duration) { audio.currentTime = pendingSeek; pendingSeek = null; }
  paint();
}
seekEl.addEventListener('pointerdown', onSeekStart);
seekEl.addEventListener('pointermove', onSeekMove);
seekEl.addEventListener('pointerup', onSeekEnd);
seekEl.addEventListener('pointercancel', onSeekEnd);
seekEl.addEventListener('touchstart', e => { const t = e.touches[0]; onSeekStart({ clientX: t.clientX }); }, { passive: true });
seekEl.addEventListener('touchmove', e => { const t = e.touches[0]; onSeekMove({ clientX: t.clientX }); }, { passive: true });
seekEl.addEventListener('touchend', onSeekEnd, { passive: true });

/* Speed */
$('speeds').onclick = e => {
  const b = e.target.closest('[data-v]');
  if (!b) return;
  audio.playbackRate = parseFloat(b.dataset.v);
  document.querySelectorAll('.spd').forEach(x => x.classList.toggle('on', x === b));
  if (speakingEl) {
    const el = speakingEl;
    const word = el.textContent.trim();
    stopSpeech();
    speakWord(word, el);
  }
};

/* Font size */
let fs = parseFloat(localStorage.getItem('lr_fs')) || 1.28;
function applyFs() {
  document.documentElement.style.setProperty('--fs', fs.toFixed(2) + 'rem');
  try { localStorage.setItem('lr_fs', fs); } catch {}
}
$('fsDn').onclick = () => { fs = Math.max(1.0, +(fs - 0.07).toFixed(2)); applyFs(); };
$('fsUp').onclick = () => { fs = Math.min(1.8, +(fs + 0.07).toFixed(2)); applyFs(); };
applyFs();

/* Audio events */
audio.addEventListener('timeupdate', paint);
audio.addEventListener('loadedmetadata', () => { $('dur').textContent = fmt(audio.duration); paint(); });
audio.addEventListener('play', () => {
  $('icon').innerHTML = PAUSE;
  playBtn.classList.add('playing');
  setPlaying(true);
});
audio.addEventListener('pause', () => {
  $('icon').innerHTML = PLAY;
  playBtn.classList.remove('playing');
  setPlaying(false);
});
audio.addEventListener('ended', () => {
  $('icon').innerHTML = PLAY;
  playBtn.classList.remove('playing');
  setPlaying(false);
  spans.forEach(s => s.classList.remove('active'));
  active = -1;
  celebrate();
});
audio.addEventListener('error', () => {
  const err = audio.error;
  let msg = 'Audio error';
  if (err) {
    if (err.code === 1) msg = 'Load aborted';
    if (err.code === 2) msg = 'Network error';
    if (err.code === 3) msg = 'Decode error';
    if (err.code === 4) msg = 'File not found';
  }
  $('note').textContent = '⚠️ ' + msg + ': ' + (story ? story.audio : '');
});

/* Keyboard */
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.closest('input, button, a')) return;
  if (e.key === ' ') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); step(-1); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); step(1); }
  else if (e.key.toLowerCase() === 'l') $('loopBtn').click();
  else if (e.key.toLowerCase() === 'w') $('modeBtn').click();
  else if (e.key === 'Escape') installModal.classList.remove('show');
});

/* Service Worker (اختياري) */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const swCode = `const CACHE='lr-v1';
self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['./','./stories.js'])).then(()=>self.skipWaiting()))});
self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()))});
self.addEventListener('fetch',e=>{
  if(e.request.method!=='GET')return;
  e.respondWith(
    fetch(e.request).then(r=>{const cl=r.clone();caches.open(CACHE).then(c=>c.put(e.request,cl));return r;})
    .catch(()=>caches.match(e.request).then(m=>m||caches.match('./')))
  );
});`;
  const blob = new Blob([swCode], { type: 'text/javascript' });
  const url = URL.createObjectURL(blob);
  navigator.serviceWorker.register(url).catch(err => {
    console.warn('SW registration failed:', err.message);
  });
}

/* Init */
applyWordMode();
renderList();
if (typeof STORIES !== 'undefined' && STORIES.length) {
  let lastId = null;
  try { lastId = localStorage.getItem('lr_last'); } catch {}
  const startId = STORIES.some(s => s.id === lastId) ? lastId : STORIES[0].id;
  openStory(startId);
}
</script>
</body>
